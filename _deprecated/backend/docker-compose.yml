# 家用本地 Postgres + pgvector
# 启动：docker compose up -d postgres
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finresearch-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finresearch}
    ports:
      - "5432:5432"
    volumes:
      - finresearch-pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin -d finresearch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finresearch-pg-data:
