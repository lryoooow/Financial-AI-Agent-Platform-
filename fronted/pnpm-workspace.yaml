packages:
  - "."

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc

# Refuse packages published < 7 days ago.
minimumReleaseAge: 10080

overrides:
  vite: 6.3.5

allowBuilds:
  "@tailwindcss/oxide": true
  electron: true
  electron-winstaller: true
  esbuild: true
