{% extends "base.html" %}
{% block body %}
{% for s in doc.sections %}
  <div class="section">
    <h3 style="font-size:14px;margin:14px 0 4px;">{{ s.title }}</h3>
    {% for para in (s.body or "").split("\n") if para.strip() %}
      <p>{{ para.strip() }}</p>
    {% endfor %}
  </div>
{% endfor %}
{% endblock %}
