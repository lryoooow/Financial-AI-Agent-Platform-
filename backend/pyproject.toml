[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finresearch"
version = "1.5.0"
description = "景渊 JingYuan · 家用本地金融研究助手后端（akshare + LangGraph 固定管线）"
readme = "README.md"
requires-python = ">=3.12"
# 注：PyInstaller 6.21+ 在 Python 3.14 已实测可用；3.12 仍是安全下限。
authors = [{ name = "Lry" }]
dependencies = [
  # Web
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.1",
  # DB（桌面默认 SQLite/aiosqlite；开发可用 PG/psycopg）
  "sqlalchemy[asyncio]>=2.0.29",
  "aiosqlite>=0.20",                   # SQLite async 驱动（桌面默认）
  "langgraph-checkpoint-sqlite>=3.1",  # SQLite 检查点（桌面默认）；>=2.0 是误导性下界，
                                       # 2.x 配不了 langgraph 1.x。3.1 + langgraph 1.2.9 已实测。
  # psycopg / langgraph-checkpoint-postgres 移至 [server] 可选依赖（桌面不安装，减小打包体积）
  # LLM / Agent
  # 下界按实际运行版本给：此前写 langchain>=0.3 / langgraph>=0.2.40 是误导性的——
  # 环境里跑的一直是 1.x，0.3 那套 API 早就不兼容了，照着装反而起不来。
  # deepagents 0.6.12 要求 langchain>=1.3.12、langchain-core>=1.4.9。
  "deepagents>=0.6.12",
  "langchain>=1.3.12",
  "langchain-core>=1.4.9",
  "langchain-openai>=1.3",
  "langgraph>=1.2.5",
  "langgraph-checkpoint>=4.1",
  # langgraph-checkpoint-postgres 移至 [server]（桌面不安装）
  # 数据源
  "akshare>=1.13",
  "pandas>=2.2",
  "pandas-ta-classic>=0.4.2",          # 技术分析（纯 pandas 兜底）
  "numpy>=1.26",
  # empyrical-reloaded / numpy-financial 已移除（声明了却源码零 import，纯死依赖）
  # 报告
  "jinja2>=3.1.3",
  # 1.2.0：真实文件导出（docx/pdf/txt/md）
  "python-docx>=1.1",          # Word .docx 导出
  "reportlab>=4.0",            # PDF 导出（不依赖 weasyprint/GTK）
  # 可选：PDF 导出（main.py 用 try/except，未安装不报错）
  # "weasyprint>=61",
  # 通用
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "tenacity>=8.2.3",
  "rapidfuzz>=3.6",
  "python-dotenv>=1.0.1",
  "chinese-calendar>=1.9",  # 中国法定节假日/调休日历（休市日判断，替代硬编码）
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]
desktop = ["pywebview>=5.0"]           # 真软件窗口（pywebview + WebView2，打包用）
packaging = ["pyinstaller>=6.0"]       # 打包成 exe
server = [                             # PostgreSQL 检查点（仅服务端部署用，桌面不装）
  "psycopg[binary]>=3.1.18",
  "langgraph-checkpoint-postgres>=0.2.0",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finresearch = ["report_templates/*.html", "data/*.json"]
